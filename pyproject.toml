[build-system]
requires = ["hatchling>=1.25", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "coauthored"
version = "0.1.0"
description = "Count AI-attributed commits (Co-authored-by trailers, AI-agent accounts, generated-with markers) in any git history, and the pre-registered study of AI co-authorship in the repositories that build AI."
dynamic = ["readme"]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Thanatchon Chongmankhong" }]
keywords = ["git", "co-authored-by", "ai-attribution", "coding-agents", "mining-software-repositories", "provenance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6",
  "polars>=1.0",
  "zstandard>=0.22",
]

[project.urls]
Homepage = "https://github.com/thanatchon36/coauthored"
Paper = "https://github.com/thanatchon36/coauthored/blob/main/paper/coauthored.pdf"
Dataset = "https://huggingface.co/datasets/thanatchon36/coauthored"
Issues = "https://github.com/thanatchon36/coauthored/issues"

[project.optional-dependencies]
analysis = ["numpy>=1.26", "scipy>=1.13", "statsmodels>=0.14", "matplotlib>=3.9"]

[project.scripts]
coauthored = "coauthored.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/coauthored"]

# the frozen catalogue and bot list ship with the wheel, so `coauthored report` runs outside a checkout
[tool.hatch.build.targets.wheel.force-include]
"configs/signatures.yaml" = "coauthored/configs/signatures.yaml"
"configs/bots.yaml" = "coauthored/configs/bots.yaml"

# the sdist carries the code only; data, paper and results live in the repository and the dataset
[tool.hatch.build.targets.sdist]
include = ["src/coauthored", "tests", "configs/signatures.yaml", "configs/bots.yaml", "README.md", "LICENSE", "pyproject.toml"]

# PyPI renders the README without the repository, so relative links and images point at GitHub
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/thanatchon36/coauthored/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/thanatchon36/coauthored/blob/main/\1)'

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/coauthored"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # literal commit messages in fixtures
