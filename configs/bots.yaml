version: '1'
# Rule (DECISIONS D7): an author whose name ends in [bot] and is not an AI-agent account in the signature
# catalogue is a maintenance bot. Listed below: automation identities without the suffix.
bot_suffix_rule: true
bots:
- id: github-action-legacy
  email: action@github\.com
  query: 'author-email:action@github.com'
  notes: Identity commonly configured in workflows ("GitHub Action").
- id: renovate-bot
  email: bot@renovateapp\.com
  query: 'author-email:bot@renovateapp.com'
- id: snyk-bot
  email: snyk-bot@snyk\.io
  query: 'author-email:snyk-bot@snyk.io'
- id: semantic-release-bot
  email: semantic-release-bot@martynus\.net
  query: 'author-email:semantic-release-bot@martynus.net'
