version: '1'
signatures:
- id: claude-code-coauthor
  tool: Claude Code
  kind: coauthor
  email: noreply@anthropic\.com
  name: claude( [a-z0-9][a-z0-9. -]*)?
  query: '"noreply@anthropic.com"'
  notes: Default trailer; model-named variants (e.g. "Claude Opus 4.5") since 2025.
- id: claude-code-generated-marker
  tool: Claude Code
  kind: marker
  text: Generated with [Claude Code]
  query: '"Generated with Claude Code"'
- id: claude-code-session-marker
  tool: Claude Code
  kind: marker
  text: 'Claude-Session: https://claude.ai/'
  query: '"Claude-Session"'
- id: claude-app-identity
  tool: Claude Code
  kind: identity
  email: 209825114\+claude\[bot\]@users\.noreply\.github\.com
  query: '"claude[bot]"'
  notes: Claude GitHub app (Claude Code in GitHub Actions).
- id: claude-app-coauthor
  tool: Claude Code
  kind: coauthor
  email: 209825114\+claude\[bot\]@users\.noreply\.github\.com
  query: '"209825114+claude[bot]"'
- id: copilot-agent-identity
  tool: GitHub Copilot
  kind: identity
  email: 198982749\+copilot@users\.noreply\.github\.com
  query: '"198982749+Copilot"'
  notes: Copilot coding agent; authors commits as "Copilot", co-authored as copilot-swe-agent[bot].
